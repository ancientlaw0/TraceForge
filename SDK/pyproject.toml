// this defines package name, verson, dependencies

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traceforge"
version = "0.1.0"
description = "LLM observability and tracing SDK"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]