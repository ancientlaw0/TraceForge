services:
  locust-master:
    image: locustio/locust:2.46.4
    ports:
      - "8089:8089"
    volumes:
      - ./:/mnt/locust
    env_file:
      - ../.env
    command: >
      -f /mnt/locust/locustfile.py
      --master
      --host http://host.docker.internal:8000

  locust-worker:
    image: locustio/locust:2.46.4
    volumes:
      - ./:/mnt/locust
    env_file:
      - ../.env
    command: >
      -f /mnt/locust/locustfile.py
      --worker
      --master-host locust-master
      --host http://host.docker.internal:8000